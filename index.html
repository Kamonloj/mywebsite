
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์ของมิวสิค</title>

  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f5d0fe);
      text-align: center;
      margin: 0;
      padding: 50px 15px;
      color: #333;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 8px 25px #5552;
    }

    h1 {
      color: #7c3aed;
      font-size: 32px;
    }

    p {
      line-height: 1.8;
    }

    .photo {
      width: 100%;
      max-width: 350px;
      border-radius: 18px;
    }

    button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5b21b6;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>สวัสดีครับ! 👋</h1>

    <p>ยินดีต้อนรับสู่เว็บไซต์ของมิวสิค</p>
    <p>นี่คือเว็บไซต์ที่ผมสร้างด้วย HTML</p>

    <img
      class="photo"
      src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700"
      alt="ภาพวิวธรรมชาติ"
    >

    <p>ขอบคุณที่เข้ามาเยี่ยมชมเว็บไซต์ครับ</p>

    <button onclick="alert('ขอบคุณที่เข้าชมเว็บไซต์ครับ!')">
      กดที่นี่
    </button>
  </div>
</body>
</html>
